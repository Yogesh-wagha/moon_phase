name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate the Gradle project
        id: locate
        run: |
          settings=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)
          if [ -z "$settings" ]; then
            echo "::error::No settings.gradle.kts anywhere in the repo."
            exit 1
          fi
          dir=$(dirname "$settings")
          echo "Gradle root: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          build-root-directory: ${{ steps.locate.outputs.dir }}

      - name: Assemble debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: moonphase-debug-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
